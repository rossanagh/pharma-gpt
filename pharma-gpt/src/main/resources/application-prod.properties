# Producție — aceleași variabile SPRING_DATASOURCE_* ca la local (vezi application.properties).
# OPENAI_API_KEY obligatoriu în Environment (Render) — nu pune cheia în Git.
spring.config.import=optional:classpath:application-local.properties

# Render setează PORT automat; local poți folosi SERVER_PORT
server.port=${PORT:${SERVER_PORT:8083}}
# Render trebuie să vadă socketul pe toate interfețele (vezi docs web-services#port-binding)
server.address=0.0.0.0

# In prod, don't log OTP codes to server logs
pharma.reset.dev-log-codes=${PHARMA_RESET_DEV_LOG_CODES:false}

# Belt-and-suspenders (some WAR/classloader paths ignore @SpringBootApplication exclude)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Cold start (Render port scan / health check) ---
# Many beans load only on first use so Tomcat binds sooner; first request may be slower.
spring.main.lazy-initialization=true
spring.main.banner-mode=off
# Repositories finish after startup (smaller refresh phase → Tomcat listens sooner).
spring.data.jpa.repositories.bootstrap-mode=deferred
# Evită round-trip-uri JDBC la metadata Hibernate (Postgres la distanță = startup foarte lent).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Run schema.sql before Hibernate so baseline DDL exists before ORM metadata (faster than defer-after-JPA).
spring.jpa.defer-datasource-initialization=false
# Mai puțin I/O în logs la cold start
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
